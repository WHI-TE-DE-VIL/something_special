{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Quick Question...</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ffb7c5, #ff66b2);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
        }

        .query-box {
            background: rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 40px 50px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(218, 24, 132, 0.25);
            z-index: 10;
        }

        h1 {
            font-family: 'Great Vibes', cursive !important;
            color: #ffffff;
            font-size: calc(2.2rem + 1.5vw);
            line-height: 1.2;
            margin: 0 0 40px 0;
            text-shadow: 0 0 15px rgba(255, 20, 147, 0.6);
        }

        /* FIXED INTERACTIVE CONTAINER HOUSING BOTH BUTTONS */
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            height: 60px;
            position: relative; /* Acts as the baseline grid boundary anchor */
        }

        .love-btn {
            padding: 12px 40px;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            box-sizing: border-box;
        }

        .yes-btn {
            background: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            transition: background 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
        }

        .yes-btn:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.08);
            box-shadow: 0 8px 20px rgba(255, 102, 178, 0.4);
        }

        /* LOCKED ABSOLUTE INITIAL LAYER: Prevents transition type friction bugs completely */
        .no-btn {
            background: rgba(255, 255, 255, 0.15);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.3);
            position: absolute;
            z-index: 15;
            left: 55%; /* Positions it naturally inside the box next to Yes button */

            /* GLIDE ANIMATION TRANSITION ENGINE: Fluid slide curve styling */
            transition: left 0.4s cubic-bezier(0.25, 0.8, 0.25, 1),
                        top 0.4s cubic-bezier(0.25, 0.8, 0.25, 1),
                        background 0.3s ease;
        }

        #confettiCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <audio id="bgAudioLoop" loop autoplay>
        <source src="{% get_static_prefix %}images/song_query.mp3" type="audio/mpeg">
    </audio>
    <canvas id="confettiCanvas"></canvas>

    <div class="query-box">
        <h1>Do you love me now also?</h1>
        <div class="btn-container" id="btnContainer">
            <!-- Pushed left slightly via inline layout to offset the absolute No button -->
            <button class="love-btn yes-btn" style="margin-right: 110px;" onclick="celebrateLove()">Yes</button>
            <button class="love-btn no-btn" id="noButton" onmouseover="teleportButton()" onclick="teleportButton()">No</button>
        </div>
    </div>

    <!-- The Javascript handling logic attaches below in Part 2... -->
    <script>
        const noBtn = document.getElementById('noButton');
        const container = document.getElementById('btnContainer');

        function teleportButton() {
            // Get the exact dimensions of the container box holding the buttons
            const containerWidth = container.offsetWidth;
            const containerHeight = container.offsetHeight;

            // Get the width of the button
            const btnWidth = noBtn.offsetWidth || 100;

            // Calculate safe boundaries so the button stays inside the pink card frame
            // We use a safe range of pixels relative to the container center
            const minX = -200;
            const maxX = 200;
            const minY = -150;
            const maxY = 150;

            // Generate totally random landing spots within the safe card area
            const randomX = Math.floor(Math.random() * (maxX - minX)) + minX;
            const randomY = Math.floor(Math.random() * (maxY - minY)) + minY;

            // Set the new coordinates relative to the button container
            // This safely triggers the smooth CSS glide transition!
            noBtn.style.left = `calc(55% + ${randomX}px)`;
            noBtn.style.top = `${randomY}px`;
        }

        // --- Canvas Confetti Party Popper Animation Engine ---
        const canvas = document.getElementById('confettiCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let animationFrameId;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class ConfettiParticle {
            constructor() {
                this.x = window.innerWidth / 2;
                this.y = window.innerHeight / 2 + 50;
                this.size = Math.random() * 8 + 6;
                this.color = `hsl(${Math.random() * 360}, 100%, 65%)`;

                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 12 + 8;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - 5;

                this.gravity = 0.3;
                this.drag = 0.96;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 8 - 4;
                this.opacity = 1;
            }

            update() {
                this.vx *= this.drag;
                this.vy *= this.drag;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.rotation += this.rotationSpeed;
                this.opacity -= 0.015;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate((this.rotation * Math.PI) / 180);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.opacity;
                ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
                ctx.restore();
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles = particles.filter(p => p.opacity > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            if (particles.length > 0) {
                animationFrameId = requestAnimationFrame(animateParticles);
            }
        }

        function celebrateLove() {
            document.getElementById('btnContainer').style.opacity = '0';
            document.getElementById('btnContainer').style.pointerEvents = 'none';

            for (let i = 0; i < 250; i++) {
                particles.push(new ConfettiParticle());
            }

            cancelAnimationFrame(animationFrameId);
            animateParticles();

            // Smoothly redirect to your 50 photo memories scrapbook grid
            setTimeout(() => {
                window.location.href = "/forever-vault/";
            }, 2500);
        }

        /* ADD THIS TO THE SCRIPT SECTION OF YOUR LOVE_QUERY.HTML */
        window.addEventListener('load', () => {
            const audio = document.getElementById('bgAudioLoop');
            const savedTime = localStorage.getItem('musicCurrentTime');

            if (audio && savedTime) {
                audio.currentTime = parseFloat(savedTime);
                audio.play().catch(e => console.log(e));
            }
        });

/* UPDATE CELEBRATELOVE FUNCTION TO SAVE TIME RIGHT BEFORE CONFETTI SHIFTS */
        function celebrateLove() {
            document.getElementById('btnContainer').style.opacity = '0';
            document.getElementById('btnContainer').style.pointerEvents = 'none';

    // Save timestamp right here
            const audio = document.getElementById('bgAudioLoop');
            if (audio) { localStorage.setItem('musicCurrentTime', audio.currentTime); }

            for (let i = 0; i < 250; i++) { particles.push(new ConfettiParticle()); }
            cancelAnimationFrame(animationFrameId);
            animateParticles();

            setTimeout(() => {
                window.location.href = "/beginning/";
            }, 250);
        }

    </script>
</body>
</html>
